name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md
          test -f LICENSE
          test -f docs/REPRODUCIBILITY.md
          test -f docs/DEMO_SCRIPT.md
          test -f demo/demo.webm
          test -f docs/assets/preview-main.png

      - name: Check key UI hooks
        run: |
          grep -q 'id="mainCanvas"' index.html
          grep -q 'id="generatePackBtn"' index.html
          grep -q 'id="matchScore"' index.html
          grep -q 'function generateStarterPack' app.js
          grep -q 'function makeQualityReport' app.js
