name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md
          test -f LICENSE
          test -f docs/REPRODUCIBILITY.md
