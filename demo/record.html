<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pixel Asset Forge Demo Recorder</title>
    <style>
      body {
        margin: 0;
        background: #0f172a;
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }

      canvas {
        display: block;
      }

      #output {
        position: fixed;
        inset: auto 0 0;
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1280" height="720"></canvas>
    <pre id="output">recording</pre>
    <script>
      const slides = [
        {
          image: "../docs/assets/preview-main.png",
          title: "Pixel Asset Forge",
          subtitle: "文本驱动的 2D 游戏像素素材生成工具",
          note: "在线预览 / 零依赖运行 / PNG / 精灵表 / JSON 元数据",
          bullets: ["浏览器端静态应用", "输入提示词即可生成", "支持角色、道具、地块、UI", "适合 Game Jam 与课程项目"],
        },
        {
          image: "../docs/assets/example-hero.png",
          title: "角色、动作帧与变体",
          subtitle: "同一提示词生成主预览、4 帧动作和稳定变体",
          note: "示例：royal crystal knight with tiny crown and blue cape",
          bullets: ["解析职业与装备", "生成攻击动作帧", "保留 seed 可复现", "展示解析完整度"],
        },
        {
          image: "../docs/assets/example-skull-key.png",
          title: "道具主体与语义装饰",
          subtitle: "组合词优先保留核心主体，再叠加符号细节",
          note: "示例：emerald skull key with green glow",
          bullets: ["key 保持道具主体", "skull 作为语义装饰", "glow 生成特效", "可导出透明 PNG"],
        },
        {
          image: "../docs/assets/example-slime.png",
          title: "非人形敌方单位",
          subtitle: "支持 slime、ghost、bat、dragon 等常见游戏轮廓",
          note: "示例：green slime enemy with tiny crown",
          bullets: ["不再固定为人形模板", "皇冠、毒液、风痕等细节可组合", "适合横版和 RPG 原型", "动作帧同步生成"],
        },
        {
          image: "../docs/assets/preview-pack.png",
          title: "一键项目素材包",
          subtitle: "快速生成角色、敌人、道具、地块和 UI 候选素材",
          note: "点击“生成一套项目素材包”后，素材库自动收集 9 个可导出条目",
          bullets: ["素材库缩略图", "manifest 清单导出", "Unity / Godot / Aseprite 建议", "适合提交与复现"],
        },
        {
          image: "../docs/assets/preview-main.png",
          title: "开源可复现交付",
          subtitle: "源码、在线预览、Demo、复现文档和提交自检齐备",
          note: "https://yuanlecheng.github.io/qiniu-pixel-asset-forge/",
          bullets: ["无 npm 安装步骤", "无后端服务", "CI 校验关键文件", "MIT License 开源"],
        },
      ];

      const canvas = document.querySelector("#stage");
      const ctx = canvas.getContext("2d");
      const output = document.querySelector("#output");

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = src;
        });
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + width, y, x + width, y + height, radius);
        ctx.arcTo(x + width, y + height, x, y + height, radius);
        ctx.arcTo(x, y + height, x, y, radius);
        ctx.arcTo(x, y, x + width, y, radius);
        ctx.closePath();
      }

      function wrapText(text, x, y, maxWidth, lineHeight) {
        let line = "";
        text.split(" ").forEach((word) => {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > maxWidth) {
            ctx.fillText(line, x, y);
            line = word;
            y += lineHeight;
          } else {
            line = next;
          }
        });
        if (line) ctx.fillText(line, x, y);
        return y;
      }

      function drawSlide(slide, image, progress, phase) {
        const width = canvas.width;
        const height = canvas.height;
        ctx.fillStyle = "#eaf1f7";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#ffffff";
        roundedRect(34, 34, 1212, 652, 20);
        ctx.fill();

        const imageW = 730;
        const imageH = 506;
        const imageX = 486;
        const imageY = 118;
        ctx.save();
        roundedRect(imageX - 10, imageY - 10, imageW + 20, imageH + 20, 16);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#d7e0ea";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.clip();
        const zoom = 1 + Math.sin(phase * Math.PI) * 0.018;
        const drawW = imageW * zoom;
        const drawH = imageH * zoom;
        ctx.drawImage(image, imageX - (drawW - imageW) / 2, imageY - (drawH - imageH) / 2, drawW, drawH);
        ctx.restore();

        ctx.fillStyle = "#0f172a";
        ctx.font = "800 48px Segoe UI, Microsoft YaHei, sans-serif";
        ctx.fillText(slide.title, 70, 128);

        ctx.fillStyle = "#2563eb";
        ctx.font = "700 25px Segoe UI, Microsoft YaHei, sans-serif";
        wrapText(slide.subtitle, 72, 180, 360, 34);

        ctx.fillStyle = "#334155";
        ctx.font = "22px Segoe UI, Microsoft YaHei, sans-serif";
        wrapText(slide.note, 72, 272, 360, 32);

        slide.bullets.forEach((text, index) => {
          const itemY = 392 + index * 48;
          ctx.fillStyle = "#15936b";
          roundedRect(74, itemY - 25, 28, 28, 7);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 19px Segoe UI, Microsoft YaHei, sans-serif";
          ctx.fillText("✓", 80, itemY - 4);
          ctx.fillStyle = "#101827";
          ctx.font = "700 23px Segoe UI, Microsoft YaHei, sans-serif";
          ctx.fillText(text, 120, itemY);
        });

        ctx.fillStyle = "#d7e0ea";
        roundedRect(70, 650, 1140, 10, 5);
        ctx.fill();
        ctx.fillStyle = "#2563eb";
        roundedRect(70, 650, 1140 * progress, 10, 5);
        ctx.fill();
      }

      async function main() {
        const images = await Promise.all(slides.map((slide) => loadImage(slide.image)));
        const stream = canvas.captureStream(24);
        const chunks = [];
        const recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp8" });
        recorder.ondataavailable = (event) => {
          if (event.data.size) chunks.push(event.data);
        };
        recorder.start();

        const framesPerSlide = 84;
        for (let slideIndex = 0; slideIndex < slides.length; slideIndex += 1) {
          for (let frame = 0; frame < framesPerSlide; frame += 1) {
            const phase = frame / framesPerSlide;
            const progress = (slideIndex + phase) / slides.length;
            drawSlide(slides[slideIndex], images[slideIndex], progress, phase);
            await wait(1000 / 24);
          }
        }
        drawSlide(slides[slides.length - 1], images[images.length - 1], 1, 1);
        await wait(300);
        recorder.stop();
        await new Promise((resolve) => {
          recorder.onstop = resolve;
        });
        const blob = new Blob(chunks, { type: "video/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let binary = "";
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte);
        });
        output.textContent = `WEBM_BASE64:${btoa(binary)}`;
      }

      main().catch((error) => {
        output.textContent = `ERROR:${error.message}`;
      });
    </script>
  </body>
</html>
